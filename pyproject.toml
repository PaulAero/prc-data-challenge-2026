[project]
name = "prc-taxiout"
version = "0.1.0"
description = "Taxi-out time prediction, EUROCONTROL PRC Data Challenge 2026"
requires-python = ">=3.12,<3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "polars>=1.0",
  "pyarrow>=15",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "xgboost>=2.1",
  "catboost>=1.2",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "minio>=7.2",
  "orjson>=3.12.0",
]

[dependency-groups]
dev = ["pytest>=8", "ipykernel>=6"]
timesfm = ["timesfm[torch]==3.0.2"]
viz = [
    "plotly>=7.1.0",
    "streamlit>=1.64.0",
]
weather = [
    "cdsapi>=0.7.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prc"]
